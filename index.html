<style>
  :root{
    --page: #3E4234;
    --paper: #FBF9F4;
    --cream: #F2EEE3;
    --ink: #211F1A;
    --olive: #565C46;
    --olive-deep: #333727;
    --mustard: #E7B94E;
    --mustard-deep: #C79A32;
    --muted: #8C8676;
    --muted-on-dark: rgba(242,238,227,0.62);
    --line: #DAD3C2;
    --line-on-dark: rgba(242,238,227,0.16);
    --danger: #A6432B;
    --radius: 20px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(242,238,227,0.045) 39px, rgba(242,238,227,0.045) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(242,238,227,0.045) 39px, rgba(242,238,227,0.045) 40px),
      var(--page);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app{ max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; }

  /* Top nav */
  .topnav{
    display:flex; justify-content:space-between; align-items:center;
    padding: 20px 20px 14px; border-bottom: 1px solid var(--line-on-dark);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:26px; height:26px; flex-shrink:0; }
  .brand .word{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 1.15rem; letter-spacing: 0.01em; line-height:1; color:var(--cream); }
  .brand .tag{ font-size:0.55rem; color:var(--muted-on-dark); letter-spacing:0.14em; text-transform:uppercase; margin-top:2px; }

  .mode-toggle{
    display:flex; background: var(--paper); border-radius: 999px; padding:3px;
    border: 1px solid var(--line);
  }
  .mode-toggle button{
    border:none; background:transparent; color:var(--muted); font-family:'Work Sans';
    font-size:0.62rem; font-weight:600; padding:7px 9px; border-radius:999px; cursor:pointer;
    letter-spacing:0.02em; text-transform:uppercase; white-space:nowrap;
  }
  .mode-toggle button.active{ background: var(--olive); color:var(--paper); }

  main{ flex:1; padding: 20px 20px 44px; }

  h1.hero{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 1.5rem; line-height:1.2;
    margin: 4px 0 6px; letter-spacing:-0.01em; color:var(--cream);
  }
  p.sub{ color: var(--muted-on-dark); font-size:0.92rem; margin: 0 0 22px; line-height:1.5; }

  /* Form */
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:0.72rem; color:var(--muted-on-dark); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em; }
  .receipt-box .field label, .customer-expand .field label{ color: var(--muted); }
  .field input, .field select{
    width:100%; background: var(--paper); border:1px solid var(--line); color:var(--ink);
    padding: 13px 14px; border-radius: 12px; font-size:0.95rem; font-family:'Work Sans';
  }
  .field input:focus, .field select:focus{ outline:none; border-color: var(--olive); }
  .bday-row{ display:flex; gap:8px; }
  .bday-row select{ flex:1; min-width:0; }
  .consent{ display:flex; gap:10px; align-items:flex-start; margin: 18px 0; font-size:0.78rem; color:var(--muted-on-dark); line-height:1.5; }
  .consent input{ margin-top:3px; accent-color: var(--olive); }

  .btn{
    width:100%; background: var(--mustard); color:var(--ink); border:none; padding:15px;
    border-radius: 14px; font-weight:700; font-size:0.95rem; cursor:pointer; font-family:'Work Sans';
    transition: transform .15s ease, background .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{ background: var(--paper); color: var(--ink); border:1px solid var(--line); }
  .btn.danger{ background: var(--danger); color:var(--paper); }

  /* Card view - light card sits on the dark olive page for strong contrast */
  .card{
    background: linear-gradient(160deg, #4A5039 0%, var(--olive-deep) 55%, #262A1E 100%);
    border: 1.5px solid rgba(231,185,78,0.4);
    border-radius: var(--radius); padding: 26px 22px 22px; position:relative; overflow:hidden;
    color: var(--paper); box-shadow: 0 20px 46px -18px rgba(0,0,0,0.6);
  }
  .card::before{
    content:''; position:absolute; top:-72px; left:-72px; width:200px; height:200px;
    border-radius:50%; border: 26px solid rgba(231,185,78,0.05);
  }
  .card-seal-hero{ display:flex; justify-content:center; margin-bottom:16px; position:relative; z-index:1; }
  .card-wordmark{ display:flex; flex-direction:column; align-items:flex-start; margin-bottom:18px; position:relative; z-index:1; }
  .card-wordmark-row{ display:flex; align-items:center; gap:9px; }
  .card-wordmark-word{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.5rem; letter-spacing:0.02em; color:var(--mustard); line-height:1; }
  .card-wordmark-sub{ font-size:0.62rem; letter-spacing:0.4em; text-transform:uppercase; color:rgba(251,249,244,0.65); margin-top:6px; margin-left:3px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 4px; position:relative; z-index:1;}
  .card-top .name{ font-family:'Space Grotesk', sans-serif; font-size:1.3rem; font-weight:700; color:var(--paper); }
  .card-top .tier{ font-size:0.62rem; color:var(--mustard); text-transform:uppercase; letter-spacing:0.1em; text-align:right; }
  .card-top .tier b{ display:block; font-family:'Space Grotesk'; font-size:0.9rem; color:var(--paper); font-weight:600; }

  .ring-wrap{ display:flex; justify-content:center; margin: 20px 0 6px; position:relative; z-index:1; }
  .ring-svg{ width: 250px; height:250px; }
  .ring-center{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    text-align:center;
  }
  .ring-center .count{ font-family:'JetBrains Mono'; font-weight:600; font-size:2rem; color:var(--paper); }
  .ring-center .of{ font-family:'JetBrains Mono'; font-size:0.8rem; color:rgba(251,249,244,0.55); }
  .ring-center .caption{ font-size:0.62rem; color:var(--mustard); text-transform:uppercase; letter-spacing:0.1em; margin-top:5px; }
  .ring-center .mark-mini{ width:20px; height:20px; margin: 0 auto 4px; opacity:0.9; }

  .stamp-dot{
    position:absolute; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transform-origin: center;
  }
  .stamp-dot .empty{ width:100%; height:100%; border-radius:50%; border:1.5px dashed rgba(251,249,244,0.3); }
  .stamp-dot .filled{
    width:100%; height:100%; border-radius:50%;
    background: var(--mustard);
    box-shadow: 0 0 0 3px rgba(231,185,78,0.3);
    display:flex; align-items:center; justify-content:center;
    animation: stampIn .4s ease;
  }
  .stamp-dot .filled svg{ width:15px; height:15px; }
  @keyframes stampIn{ from{ transform: scale(0.3); opacity:0;} to{ transform: scale(1); opacity:1;} }

  .free-banner{
    text-align:center; background: rgba(251,249,244,0.1); border:1px solid rgba(251,249,244,0.28);
    color: var(--paper); font-size:0.83rem; padding:10px; border-radius:12px; margin: 14px 0 4px;
    font-weight:600; position:relative; z-index:1;
  }

  .qr-box{ display:flex; justify-content:center; margin: 18px 0 6px; position:relative; z-index:1; }
  .qr-frame{ background:#FFFFFF; padding:12px; border-radius:14px; }
  .id-line{ text-align:center; font-family:'JetBrains Mono'; font-size:0.68rem; color:rgba(251,249,244,0.5); letter-spacing:0.05em; margin-top:8px; position:relative; z-index:1; }

  .card-address{
    text-align:center; font-size:0.62rem; color:rgba(251,249,244,0.55); letter-spacing:0.08em;
    text-transform:uppercase; margin-top:16px; padding-top:12px; border-top:1px dashed rgba(251,249,244,0.2);
    position:relative; z-index:1;
  }

  .review-btn{
    display:flex; align-items:center; justify-content:center; gap:5px; flex-wrap:nowrap;
    background: rgba(231,185,78,0.14); border:1.5px solid var(--mustard);
    border-radius:12px; padding:9px 12px; margin-top:12px; text-decoration:none;
    position:relative; z-index:1;
  }
  .review-btn-text{ display:flex; align-items:center; gap:4px; font-family:'Work Sans'; font-weight:600; font-size:0.76rem; color:var(--paper); white-space:nowrap; }
  .google-wordmark-inline{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.82rem; }
  .review-stars{ display:flex; gap:1px; flex-shrink:0; }
  .review-stars svg{ width:10px; height:10px; fill:#F4B400; }

  .ios-tip{ margin-top:10px; text-align:right; }
  .ios-tip summary{
    display:inline-block; list-style:none; cursor:pointer;
    font-family:'Work Sans'; font-size:0.68rem; color:#FFFFFF;
    opacity:0.95; text-decoration:underline; text-decoration-style:dotted;
  }
  .ios-tip summary::-webkit-details-marker{ display:none; }
  .ios-tip-body{
    margin-top:6px; text-align:left; font-size:0.72rem; color:var(--muted);
    line-height:1.5; background:rgba(0,0,0,0.12); border-radius:8px; padding:8px 10px;
  }

  .section-label{
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted-on-dark);
    margin: 26px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--line-on-dark); }
  .receipt-box .section-label{ color:var(--muted); }
  .receipt-box .section-label::after{ background:var(--line); }

  .staff-list{ display:flex; flex-direction:column; gap:8px; }
  .customer-block{ }
  .cust-row{
    background: var(--paper); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; gap:10px;
  }
  .cust-row.selected{ border-color: var(--olive); background: #EFEADB; border-radius:14px 14px 0 0; }
  .cust-row .cname{ font-weight:600; font-size:0.9rem; color:var(--ink); }
  .cust-row .cid{ font-family:'JetBrains Mono'; font-size:0.66rem; color:var(--muted); margin-left:6px; }
  .cust-row .cmeta{ font-size:0.7rem; color:var(--muted); margin-top:2px; }
  .cust-row .cstamps{ font-family:'JetBrains Mono'; font-size:0.95rem; color:var(--olive); font-weight:600; flex-shrink:0; }
  .mini-actions{ display:flex; gap:6px; flex-shrink:0; }
  .mini-btn{
    border:1px solid var(--line); background:var(--cream); color:var(--ink); font-size:0.62rem; font-weight:600;
    padding:5px 8px; border-radius:8px; cursor:pointer; text-transform:uppercase; letter-spacing:0.02em; white-space:nowrap;
  }
  .mini-btn.danger{ border-color: rgba(166,67,43,0.4); color: var(--danger); }
  .customer-expand{
    background: var(--paper); border:1px solid var(--olive); border-top:none; border-radius:0 0 14px 14px;
    padding: 14px 16px 16px;
  }
  .empty-state{ text-align:center; color:var(--muted-on-dark); font-size:0.85rem; padding: 30px 10px; }

  .action-row{ display:flex; gap:10px; margin-top:16px; }
  .action-row .btn{ flex:1; }

  .checkbox-row{ display:flex; align-items:center; gap:10px; color:var(--cream); }
  .checkbox-row input{ accent-color: var(--mustard); width:18px; height:18px; }
  .receipt-box .checkbox-row, .customer-expand .checkbox-row{ color: var(--ink); }

  textarea{
    width:100%; background: var(--paper); border:1px solid var(--line); color:var(--ink);
    padding: 13px 14px; border-radius: 12px; font-size:0.9rem; font-family:'Work Sans'; resize:vertical; min-height:80px;
  }
  textarea:focus{ outline:none; border-color:var(--olive); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background: var(--ink); color:var(--paper); padding:12px 20px; border-radius:12px;
    font-weight:600; font-size:0.85rem; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    animation: toastIn .3s ease, toastOut .3s ease 2.2s forwards;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%, 10px);} to{ opacity:1; transform:translate(-50%,0);} }
  @keyframes toastOut{ to{ opacity:0; } }

  .receipt-box{
    background: var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    margin-top:12px;
  }
  .receipt-box .who{ font-size:0.8rem; color:var(--muted); margin-bottom:10px; }
  .receipt-box .who b{ color:var(--ink); }
  .history-list{ margin-top:12px; }
  .history-item{
    display:flex; justify-content:space-between; font-size:0.78rem; color:var(--muted);
    padding: 7px 0; border-bottom:1px dashed var(--line);
  }
  .history-item b{ color: var(--ink); font-family:'JetBrains Mono'; font-weight:600; }
  .history-empty{ font-size:0.78rem; color:var(--muted); padding:6px 0; }
  .warn-text{ color:var(--danger); font-size:0.75rem; margin-top:6px; }
  .note{ font-size:0.72rem; color:var(--muted-on-dark); line-height:1.55; margin-top:18px; }
  .receipt-box .note, .customer-expand .note, .report-panel .note{ color: var(--muted); }
  .link-btn{ background:none; border:none; color:var(--mustard); font-size:0.82rem; text-decoration:underline; cursor:pointer; padding:0; margin-top:16px; }

  .footer-addr{ text-align:center; font-size:0.65rem; color:var(--muted-on-dark); letter-spacing:0.06em; margin-top:28px; text-transform:uppercase; }

  .card-brand{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .card-brand .word{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:0.85rem; letter-spacing:0.01em; color:var(--ink); }
  .card-brand .tag{ font-size:0.62rem; color:var(--muted); font-weight:500; margin-left:4px; }

  .phone-mock{ border:1px solid var(--line-on-dark); border-radius:26px; overflow:hidden; margin-top:14px; box-shadow:0 20px 44px -22px rgba(0,0,0,0.55); }
  .phone-mock-header{ background:var(--page); padding:16px 18px 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line-on-dark); }
  .phone-mock-body{ background:var(--page); padding:16px 18px 28px; }

  .report-backdrop{
    position:fixed; inset:0; background:rgba(20,18,13,0.6); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .report-panel{
    background: var(--paper); width:100%; max-width:480px; border-radius: 22px 22px 0 0;
    padding: 22px 20px 30px; max-height:88vh; overflow-y:auto;
    box-shadow: 0 -20px 50px rgba(0,0,0,0.4);
  }
  .report-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .report-header h2{ font-family:'Space Grotesk', sans-serif; font-size:1.15rem; font-weight:700; color:var(--ink); margin:0; }
  .report-close{ border:none; background:var(--cream); color:var(--ink); width:30px; height:30px; border-radius:50%; font-size:0.9rem; cursor:pointer; }
</style>
</head>

<div class="app" id="app"></div>

<!-- Reusable SVG defs: the Λ mark, redrawn from the café's own logo -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mark-shape">
      <path d="M12 4 L20 21 M12 4 L4 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    </g>
  </defs>
</svg>

<script>
/* ============================================================
   CONFIGURACIÓN DE FIREBASE
   Reemplazá estos valores por los de tu proyecto real:
   Firebase console → Configuración del proyecto → Tus apps → SDK config
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCJ5HkexrCutXzhr9CgHHb6t3nEE2BTiZM",
  authDomain: "tarjeta-fidelizacion-norai.firebaseapp.com",
  databaseURL: "https://tarjeta-fidelizacion-norai-default-rtdb.firebaseio.com",
  projectId: "tarjeta-fidelizacion-norai",
  storageBucket: "tarjeta-fidelizacion-norai.firebasestorage.app",
  messagingSenderId: "905930912651",
  appId: "1:905930912651:web:48a50e762f50280fd9f58e"
};

/* Reglas de Firestore para pruebas (Firebase console → Firestore → Reglas):
   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /customers/{customerId} {
         allow read, write: if true; // ⚠️ Abierto solo para probar. No usar así en producción.
       }
     }
   }
*/

let db, fsDoc, fsGetDoc, fsSetDoc, fsGetDocs, fsCollection, fsQuery, fsWhere, fsDeleteDoc, fsOnSnapshot;
let auth, authSignInEmail, authSignInGoogle, authSignOut, GoogleProvider;

async function initFirebase(){
  if(!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('TU_')){
    state.configError = 'Falta completar firebaseConfig con los datos reales de tu proyecto Firebase (arriba en el código).';
    render();
    return false;
  }
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
    const app = initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    fsDoc = fs.doc; fsGetDoc = fs.getDoc; fsSetDoc = fs.setDoc; fsDeleteDoc = fs.deleteDoc;
    fsGetDocs = fs.getDocs; fsCollection = fs.collection; fsOnSnapshot = fs.onSnapshot;
    fsQuery = fs.query; fsWhere = fs.where;

    auth = authMod.getAuth(app);
    authSignInEmail = authMod.signInWithEmailAndPassword;
    authSignInGoogle = authMod.signInWithPopup;
    authSignOut = authMod.signOut;
    GoogleProvider = authMod.GoogleAuthProvider;

    authMod.onAuthStateChanged(auth, async (user)=>{
      if(user && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((user.email||'').toLowerCase())){
        state.isAdmin = true;
        state.adminEmail = user.email;
        render();
        // Las reglas de Firestore ahora exigen estar logueado como admin para listar
        // clientes y empresas; apenas se confirma el login, dejamos todo escuchando en vivo.
        startAdminRealtimeListeners();
        return;
      } else if(user){
        // Se autenticó con Firebase pero no está en la lista de administradores permitidos
        state.isAdmin = false;
        state.adminEmail = null;
        stopAdminRealtimeListeners();
        showToast('Esta cuenta no tiene permisos de administrador');
        await authSignOut(auth);
        return;
      } else {
        state.isAdmin = false;
        state.adminEmail = null;
        stopAdminRealtimeListeners();
      }
      render();
    });

    return true;
  }catch(e){
    console.error(e);
    state.configError = 'No se pudo conectar a Firebase. Revisá el firebaseConfig y que Firestore/Authentication estén habilitados en tu proyecto.';
    render();
    return false;
  }
}
</script>

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

async function generateFriendlyId(){
  for(let i=0; i<25; i++){
    const candidate = String(Math.floor(100000 + Math.random()*900000)); // 6 dígitos, fácil de teclear
    try{
      const snap = await fsGetDoc(fsDoc(db, 'customers', candidate));
      if(!snap.exists()) return candidate;
    }catch(e){ /* si falla la verificación, seguimos probando otro */ }
  }
  return uid('nrc'); // resguardo por si no se consiguió un número libre
}

let myCardUnsubscribe = null;

function startMyCardListener(id){
  if(myCardUnsubscribe){ myCardUnsubscribe(); myCardUnsubscribe = null; }
  myCardUnsubscribe = fsOnSnapshot(fsDoc(db, 'customers', id), async (snap)=>{
    if(!snap.exists()){
      if(state.me && state.me.id === id){
        state.me = null;
        state.screen = 'register';
        render();
      }
      return;
    }
    const data = { id, ...snap.data() };
    if(data.companyStatus === 'approved' && data.companyCode){
      try{
        const coSnap = await fsGetDoc(fsDoc(db, 'companies', data.companyCode));
        data.company = coSnap.exists() ? { id: coSnap.id, ...coSnap.data() } : null;
      }catch(e){ data.company = null; }
    }
    state.me = data;
    if(state.screen === 'loading') state.screen = 'card';
    render();
  }, (err)=>{ console.error(err); });
}

async function loadMe(){
  try{
    const myId = localStorage.getItem('norai-my-id');
    if(myId){
      startMyCardListener(myId);
      return;
    }
  }catch(e){ console.error(e); }
  state.screen = 'register';
  render();
}

let customersUnsubscribe = null;
let companiesUnsubscribe = null;
let deletedCompaniesUnsubscribe = null;

// Mientras el admin esté logueado, dejamos "escuchando" en vivo los clientes y
// empresas: cualquier cambio (nuevo cliente, solicitud de empresa, sello sumado
// desde otro dispositivo, etc.) se refleja solo, sin recargar la pestaña.
function startAdminRealtimeListeners(){
  stopAdminRealtimeListeners();
  customersUnsubscribe = fsOnSnapshot(fsCollection(db, 'customers'), (snap)=>{
    state.allCustomers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    backfillCustomerIndexes(state.allCustomers);
    render();
  }, (err)=>{ console.error(err); });

  companiesUnsubscribe = fsOnSnapshot(fsCollection(db, 'companies'), (snap)=>{
    state.allCompanies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, (err)=>{ console.error(err); });

  deletedCompaniesUnsubscribe = fsOnSnapshot(fsCollection(db, 'deletedCompanies'), (snap)=>{
    state.deletedCompanies = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.deletedAt||0) - (a.deletedAt||0));
    render();
  }, (err)=>{ console.error(err); });
}

function stopAdminRealtimeListeners(){
  if(customersUnsubscribe){ customersUnsubscribe(); customersUnsubscribe = null; }
  if(companiesUnsubscribe){ companiesUnsubscribe(); companiesUnsubscribe = null; }
  if(deletedCompaniesUnsubscribe){ deletedCompaniesUnsubscribe(); deletedCompaniesUnsubscribe = null; }
}

async function loadAllCustomers(){
  try{
    const snap = await fsGetDocs(fsCollection(db, 'customers'));
    state.allCustomers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    backfillCustomerIndexes(state.allCustomers); // no bloquea el render, corre en segundo plano
  }catch(e){
    console.error(e);
    state.allCustomers = [];
  }
}

// Clientes registrados antes de que existiera phoneIndex/emailIndex no tienen esos
// documentos todavía, así que no se podrían recuperar por correo. Como el admin sí
// puede listar y escribir, aprovechamos cada carga del panel de Personal para
// completar los índices que falten, en silencio.
async function backfillCustomerIndexes(customers){
  if(!state.isAdmin) return;
  for(const c of customers){
    try{
      if(c.phone){
        const s = await fsGetDoc(fsDoc(db, 'phoneIndex', c.phone));
        if(!s.exists()) await fsSetDoc(fsDoc(db, 'phoneIndex', c.phone), { customerId: c.id });
      }
      if(c.email){
        const s2 = await fsGetDoc(fsDoc(db, 'emailIndex', c.email));
        if(!s2.exists()) await fsSetDoc(fsDoc(db, 'emailIndex', c.email), { customerId: c.id });
      }
    }catch(e){ console.error(e); }
  }
}

async function saveCustomer(cust){

}

async function loadCompanies(){
  try{

function maskEmail(email){
  if(!email || email.indexOf('@') === -1) return '';
  const [user, domain] = email.split('@');
  const shown = user.slice(0, Math.min(2, user.length));
  return shown + '***@' + domain;
}

function generateSixDigitCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

async function sendRecoveryCodeEmail(email, code, name){
  const res = await fetch('/.netlify/functions/send-recovery-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, code, name })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'No se pudo enviar el correo');
}

async function handleRecover(){
  const emailInput = document.getElementById('recover-email');
  const email = (emailInput ? emailInput.value : '').trim().toLowerCase();

  if(!email){
    state.recoverWarning = 'Ingresá el correo con el que te registraste.';
    render();
    return;
  }

  state.recovering = true;
  state.recoverWarning = '';
  render();

  try{
    const idxSnap = await fsGetDoc(fsDoc(db, 'emailIndex', email));
    state.recovering = false;

    if(!idxSnap.exists()){
      state.recoverWarning = 'No encontramos ninguna tarjeta con ese correo. Fijate que esté bien escrito, o registrate como cliente nuevo.';
      render();
      return;
    }

    const customerId = idxSnap.data().customerId;
    const custSnap = await fsGetDoc(fsDoc(db, 'customers', customerId));
    if(!custSnap.exists()){
      state.recoverWarning = 'No encontramos ninguna tarjeta con ese correo. Fijate que esté bien escrito, o registrate como cliente nuevo.';
      render();
      return;
    }

    const cust = { id: custSnap.id, ...custSnap.data() };

    state.recoverPendingCustomer = cust;
    await requestNewRecoveryCode();
  }catch(e){
    console.error(e);
    state.recovering = false;
    state.recoverWarning = 'No se pudo conectar para buscar tu tarjeta. Probá de nuevo.';
    render();
  }
}

async function requestNewRecoveryCode(){
  const cust = state.recoverPendingCustomer;
  if(!cust) return;
  state.sendingCode = true;
  state.recoverCodeWarning = '';
  render();

  try{
    const code = generateSixDigitCode();
    const expiresAt = Date.now() + 10*60*1000; // 10 minutos
    await fsSetDoc(fsDoc(db, 'customers', cust.id), { recoveryCode: { code, expiresAt, attempts: 0 } }, { merge: true });
    await sendRecoveryCodeEmail(cust.email, code, cust.name);
    state.sendingCode = false;
    state.recoverStep = 'code';
    state.recoverCodeInput = '';
    state.resendCooldown = 30;
    const tick = setInterval(()=>{
      state.resendCooldown = Math.max(0, state.resendCooldown - 1);
      if(state.resendCooldown === 0) clearInterval(tick);
      render();
    }, 1000);
    render();
  }catch(e){
    console.error(e);
    state.sendingCode = false;
    state.recoverWarning = 'No pudimos enviar el código a tu correo. Probá de nuevo en unos segundos.';
    state.recoverStep = 'phone';
    render();
  }
}

async function verifyRecoveryCode(){
  const cust = state.recoverPendingCustomer;
  if(!cust) return;
  const input = (state.recoverCodeInput||'').trim();
  if(!input){
    state.recoverCodeWarning = 'Ingresá el código de 6 dígitos que te enviamos por correo.';
    render();
    return;
  }

  state.verifyingCode = true;
  state.recoverCodeWarning = '';
  render();

  try{
    const snap = await fsGetDoc(fsDoc(db, 'customers', cust.id));
    if(!snap.exists()){
      state.verifyingCode = false;
      state.recoverCodeWarning = 'No pudimos validar el código. Probá de nuevo.';
      render();
      return;
    }
    const fresh = { id: cust.id, ...snap.data() };
    const rc = fresh.recoveryCode;

    if(!rc || Date.now() > rc.expiresAt){
      state.verifyingCode = false;
      state.recoverCodeWarning = 'Ese código venció. Pedí uno nuevo.';
      render();
      return;
    }
    if((rc.attempts||0) >= 5){
      state.verifyingCode = false;
      state.recoverCodeWarning = 'Demasiados intentos. Pedí un código nuevo.';
      render();
      return;
    }
    if(input !== rc.code){
      await fsSetDoc(fsDoc(db, 'customers', cust.id), { recoveryCode: { ...rc, attempts: (rc.attempts||0) + 1 } }, { merge: true });
      state.verifyingCode = false;
      state.recoverCodeWarning = 'Código incorrecto. Te quedan ' + (4 - (rc.attempts||0)) + ' intento(s).';
      render();
      return;
    }

    // Código correcto: limpiamos el código usado y entramos
    await fsSetDoc(fsDoc(db, 'customers', cust.id), { recoveryCode: null }, { merge: true });
    if(fresh.companyStatus === 'approved' && fresh.companyCode){
      try{
        const coSnap = await fsGetDoc(fsDoc(db, 'companies', fresh.companyCode));
        fresh.company = coSnap.exists() ? { id: coSnap.id, ...coSnap.data() } : null;
      }catch(e){ /* ignore */ }
    }

    localStorage.setItem('norai-my-id', fresh.id);
    state.me = fresh;
    state.screen = 'card';
    state.recoverStep = 'phone';
    state.recoverPendingCustomer = null;
    state.recoverCodeInput = '';
    state.verifyingCode = false;
    startMyCardListener(fresh.id);
    render();
  }catch(e){
    console.error(e);
    state.verifyingCode = false;
    state.recoverCodeWarning = 'No se pudo conectar para validar el código. Probá de nuevo.';
    render();
  }
}

function cancelRecoveryCode(){
  state.recoverStep = 'phone';
  state.recoverPendingCustomer = null;
  state.recoverCodeInput = '';
  state.recoverCodeWarning = '';
  render();
}

  const id = await generateFriendlyId();

  localStorage.setItem('norai-my-id', id);
  state.me = cust;
  state.screen = 'card';
  startMyCardListener(id);
  render();
  showToast('¡Listo! Tu tarjeta se creó correctamente 🎉');
}

async function submitReceipt(customerId){
  const receipt = (state.receiptValue||'').trim();
  if(!receipt){
    state.receiptWarning = 'Ingresá el N° de boleta para poder sumar el sello.';
    render();
    return;
  }
  state.receiptWarning = '';
  state.lookingUpReceipt = true;
  render();

  try{
    const res = await fetch('/.netlify/functions/lookup-receipt?receipt=' + encodeURIComponent(receipt));
    const data = await res.json();
    state.lookingUpReceipt = false;

    if(!data.ok){
      state.receiptWarning = data.error || 'No se pudo validar esa boleta.';
      render();
      return;
    }

    state.productsValue = (data.products || []).join(', ');
    state.amountValue = data.amount != null ? String(data.amount) : '';
    state.lastProductDetails = data.productDetails || null;
    state.lastMainCoffee = data.mainCoffee || null;
  }catch(e){
    console.error(e);
    state.lookingUpReceipt = false;
    state.receiptWarning = 'No se pudo conectar con la validación de boletas. Probá de nuevo.';
    render();
    return;
  }

  await addStamp(customerId);
}

async function addStamp(customerId){
  const receipt = (state.receiptValue||'').trim();
  if(!receipt){
    state.receiptWarning = 'Ingresá el N° de boleta para poder sumar el sello.';
    render();
    return;
  }

  const snap = await fsGetDoc(fsDoc(db, 'customers', customerId));
  if(!snap.exists()) return;
  let cust = { id: customerId, ...snap.data() };

  if(cust.disabled){
    state.receiptWarning = 'Este cliente está deshabilitado. Un administrador tiene que habilitarlo antes de poder sumarle sellos.';
    render();
    return;
  }

  cust.history = cust.history || [];
  cust.tasteProfile = cust.tasteProfile || {};

  if(cust.stamps >= STAMPS_GOAL){
    state.receiptWarning = 'Este cliente ya completó sus '+STAMPS_GOAL+' sellos. Canjeá el café gratis antes de seguir sumando.';
    render();
    return;
  }

  const already = cust.history.some(h => h.receipt && h.receipt.toLowerCase() === receipt.toLowerCase());
  if(already){
    state.receiptWarning = 'Esa boleta (N° ' + receipt + ') ya fue usada para sumar un sello de ' + cust.name + '. Revisá antes de continuar.';
    render();
    return;
  }

  const products = (state.productsValue||'').split(',').map(p=>p.trim()).filter(Boolean);
  const custCo = state.allCompanies.find(x => x.id === cust.companyCode);
  const activeCompanyBenefit = cust.companyStatus === 'approved' && !!custCo && custCo.active !== false && cust.companyEnabled !== false;
  const hasCompanyDiscount = activeCompanyBenefit ? true : !!state.receiptCompanyDiscount;
  const amount = state.amountValue !== '' && state.amountValue != null ? Number(state.amountValue) : null;

  let companyName = '', companyDiscountLabel = '';
  if(hasCompanyDiscount && cust.companyStatus === 'approved' && cust.companyCode){
    const co = state.allCompanies.find(x => x.id === cust.companyCode);
    if(co){ companyName = co.name; companyDiscountLabel = co.discount; }
  }

  let justCompleted = false;
  if(hasCompanyDiscount){
    cust.history.unshift({ receipt, ts: Date.now(), products, amount, productDetails: state.lastProductDetails || null, mainCoffee: state.lastMainCoffee || null, companyDiscount: true, companyName, companyDiscountLabel });
  } else {
    cust.stamps += 1;
    justCompleted = cust.stamps >= STAMPS_GOAL;
    cust.history.unshift({ receipt, ts: Date.now(), products, amount, productDetails: state.lastProductDetails || null, mainCoffee: state.lastMainCoffee || null });
  }
  cust.history = cust.history.slice(0, 500);
  products.forEach(p=>{ cust.tasteProfile[p] = (cust.tasteProfile[p]||0) + 1; });

  await saveCustomer(cust);
  await loadAllCustomers();
  const coffeeLabel = state.lastMainCoffee ? ' — ' + state.lastMainCoffee.name + ' $' + state.lastMainCoffee.amount : '';
  state.receiptValue = '';
  state.productsValue = '';
  state.receiptWarning = '';
  state.receiptCompanyDiscount = false;
  state.amountValue = '';
  state.lastProductDetails = null;
  state.lastMainCoffee = null;
  if(hasCompanyDiscount){
    showToast('Boleta registrada con descuento de empresa para ' + cust.name + ' — no suma sello.');
  } else {
    showToast(justCompleted ? '¡'+cust.name+' completó sus '+STAMPS_GOAL+' sellos! Confirmá el canje cuando le entregues el café.' : 'Sello agregado a ' + cust.name + coffeeLabel + ' (boleta N° ' + receipt + ')');
  }
  if(state.me && state.me.id === customerId){ state.me = cust; }
  render();
}

async function redeemFree(customerId){
  if(!state.isAdmin){ showToast('Solo un administrador puede activar el café gratis.'); return; }
  const snap = await fsGetDoc(fsDoc(db, 'customers', customerId));
  if(!snap.exists()) return;
  let cust = { id: customerId, ...snap.data() };
  if((cust.stamps||0) < STAMPS_GOAL){ showToast('Este cliente todavía no llega a '+STAMPS_GOAL+' sellos.'); return; }
  cust.stamps = 0;
  cust.redeemed = (cust.redeemed||0) + 1;
  cust.history = cust.history || [];
  cust.history.unshift({ ts: Date.now(), redemption: true });
  cust.history = cust.history.slice(0, 500);
  await saveCustomer(cust);
  await loadAllCustomers();
  showToast('☕ Café gratis canjeado para ' + cust.name + '. Su tarjeta vuelve a empezar en 0.');
  if(state.me && state.me.id === customerId){ state.me = cust; }
  render();
}

function topTastes(cust, n){
  const profile = cust.tasteProfile || {};
  return Object.entries(profile).sort((a,b)=>b[1]-a[1]).slice(0, n||3).map(e=>e[0]);
}

function matchesSearch(c, q){
  if(!q) return true;
  const needle = q.trim().toLowerCase();
  if(!needle) return true;
  return (c.name||'').toLowerCase().startsWith(needle)
    || (c.phone||'').toLowerCase().startsWith(needle)
    || (c.email||'').toLowerCase().startsWith(needle)
    || (c.id||'').toLowerCase().startsWith(needle);
}

function fmtBirthday(b){
  if(!b) return '';
  const parts = b.split('-');
  if(parts.length !== 3) return b;
  const [y, m, d] = parts;
  return d + '/' + m + '/' + y;
}

function isBirthdayToday(cust){
  if(!cust.birthday) return false;
  const parts = cust.birthday.split('-');
  if(parts.length !== 3) return false;
  const today = new Date();
  return parseInt(parts[2],10) === today.getDate() && parseInt(parts[1],10) === (today.getMonth()+1);
}

function daySelectOptions(selected){
  let o = '<option value="">Día</option>';
  for(let d=1; d<=31; d++){
    o += '<option value="'+d+'"'+(String(d)===String(selected)?' selected':'')+'>'+d+'</option>';
  }
  return o;
}

function monthSelectOptions(selected){
  const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let o = '<option value="">Mes</option>';
  months.forEach((m,i)=>{
    const v = i+1;
    o += '<option value="'+v+'"'+(String(v)===String(selected)?' selected':'')+'>'+m+'</option>';
  });
  return o;
}

function yearSelectOptions(selected){
  const current = new Date().getFullYear();
  let o = '<option value="">Año</option>';
  for(let y=current; y>=current-90; y--){
    o += '<option value="'+y+'"'+(String(y)===String(selected)?' selected':'')+'>'+y+'</option>';
  }
  return o;
}

function splitBirthday(b){
  if(!b) return { day:'', month:'', year:'' };
  const parts = b.split('-');
  if(parts.length !== 3) return { day:'', month:'', year:'' };
  return { year: String(parseInt(parts[0],10)), month: String(parseInt(parts[1],10)), day: String(parseInt(parts[2],10)) };
}

function ringPositions(n, radius){
  const pts = [];
  for(let i=0;i<n;i++){
    const angle = (i / n) * 2 * Math.PI - Math.PI/2;
    pts.push({ x: radius * Math.cos(angle), y: radius * Math.sin(angle) });
  }
  return pts;
}

function renderRing(stamps){
  const shown = Math.min(stamps, STAMPS_GOAL);
  const radius = 104;
  const pts = ringPositions(STAMPS_GOAL, radius);
  let html = '<div class="ring-wrap"><svg class="ring-svg" viewBox="-130 -130 260 260">';
  html += '<circle cx="0" cy="0" r="'+radius+'" fill="none" stroke="rgba(33,31,26,0.16)" stroke-width="1.5" stroke-dasharray="2 6"/>';
  html += '</svg>';
  pts.forEach((p, i)=>{
    const filled = i < shown;
    html += '<div class="stamp-dot" style="left:calc(50% + '+p.x+'px - 16px); top:calc(50% + '+p.y+'px - 16px);">'
      + (filled ? '<div class="filled">'+markSVG(15,'#211F1A')+'</div>' : '<div class="empty"></div>')
      + '</div>';
  });
  html += '<div class="ring-center">'
    + '<div class="mark-mini">'+markSVG(20,'#565C46')+'</div>'
    + '<div class="count">'+shown+'<span class="of">/'+STAMPS_GOAL+'</span></div><div class="caption">sellos</div></div>';
  html += '</div>';
  return html;
}

function isIOSDevice(){
  const ua = navigator.userAgent || '';
  const isIPhoneOrIPad = /iPhone|iPad|iPod/.test(ua);
  // iPadOS 13+ reports as "Macintosh" but has touch support, unlike real Macs
  const isTouchMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  return isIPhoneOrIPad || isTouchMac;
}

function isStandaloneApp(){
  return window.navigator.standalone === true
    || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

async function saveToGoogleWallet(customerId, name, stamps){
  showToast('Preparando tu tarjeta de Google Wallet...');
  try{
    const url = '/.netlify/functions/create-wallet-pass?customerId=' + encodeURIComponent(customerId)
      + '&name=' + encodeURIComponent(name)
      + '&stamps=' + encodeURIComponent(stamps)
      + '&goal=' + encodeURIComponent(STAMPS_GOAL);
    const res = await fetch(url);
    const data = await res.json();
    if(!data.ok){
      showToast(data.error || 'No se pudo preparar la tarjeta de Wallet.');
      return;
    }
    window.open(data.saveUrl, '_blank');
  }catch(e){
    console.error(e);
    showToast('No se pudo conectar con Google Wallet. Probá de nuevo.');
  }
}

    + '<div class="tier">Nivel<b>'+tierLabel+'</b></div></div>';

    html += '<div class="free-banner" style="background:rgba(231,185,78,0.22); border-color:rgba(231,185,78,0.55); color:var(--ink);">🏢 Beneficio <b>'+cust.company.name+'</b>: '+cust.company.discount+'</div>';

    html += '<div class="free-banner" style="background:rgba(230,120,90,0.16); border-color:rgba(230,120,90,0.4);">Esta tarjeta está deshabilitada temporalmente. Contactá al local para más información.</div>';

    const googleWord = '<span class="google-wordmark-inline"><span style="color:#4285F4;">G</span><span style="color:#EA4335;">o</span><span style="color:#FBBC05;">o</span><span style="color:#4285F4;">g</span><span style="color:#34A853;">l</span><span style="color:#EA4335;">e</span></span>';
    if(isIOSDevice()){

        html += '<details class="ios-tip">'
          + '<summary>📲 Acceso rápido a tu tarjeta</summary>'
          + '<div class="ios-tip-body">Tocá el ícono de compartir <span style="font-size:1.1em;">⬆️</span> de Safari y elegí <b>"Agregar a pantalla de inicio"</b>. Te va a quedar un ícono como si fuera una app.</div>'
          + '</details>';

    } else {
      html += '<button type="button" class="review-btn" style="width:100%; border:none; cursor:pointer; margin-bottom:8px;" onclick="saveToGoogleWallet(\''+cust.id+'\',\''+cust.name.replace(/'/g,"\\'")+'\','+cust.stamps+')">'

      + '<div class="review-btn-text">Déjanos tu reseña en '+googleWord+'<span class="review-stars">'+star+star+star+star+star+'</span></div>'
      + '</a>';

  html += '<div class="section-label" style="margin-top:0;">'+(isOwn ? 'Tus últimos 5 sellos' : 'Últimos 5 sellos de '+cust.name)+'</div>';
  if(clientHist.length === 0){
    html += '<div class="history-empty">Todavía no '+(isOwn ? 'tenés' : 'tiene')+' sellos registrados'+(isOwn ? '. Pedí que te lo sumen en caja al retirar tu café.' : '.')+'</div>';

    html += '<p class="note">Mostrá este código QR en caja para que sumen tu sello. En una versión conectada a Apple Wallet / Google Wallet, esta misma tarjeta viviría directamente en tu celular sin abrir esta página.</p>';

  }
  return html;

function restoreFocus(focusInfo){
  if(!focusInfo) return;
  const el = document.getElementById(focusInfo.id);
  if(el){
    el.focus();
    try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
  }
}

            + '<select id="admin-edit-bday-month" style="flex:1.5;" onchange="state.adminEditBirthMonth=this.value;">'+monthSelectOptions(state.adminEditBirthMonth)+'</select>'
            + '<select id="admin-edit-bday-year" style="flex:1.3;" onchange="state.adminEditBirthYear=this.value;">'+yearSelectOptions(state.adminEditBirthYear)+'</select>'
            + '</div></div>';
          html += '<div class="field" style="margin-bottom:8px;"><label>Comentario interno (solo staff)</label>'
            + '<textarea id="admin-edit-note" placeholder="Ej: prefiere leche de avena, alérgico a la canela..." oninput="state.adminEditNote=this.value;">'+(state.adminEditNote||'')+'</textarea></div>';
          html += '<div class="action-row">'
            + '<button class="btn secondary" onclick="toggleAdminEdit(null)">Cancelar</button>'
            + '<button class="btn" onclick="saveAdminEdit(\''+c.id+'\')">Guardar</button>'
            + '</div>';
          html += '</div>';
        }

        if(sel){
          html += '<div class="customer-expand">';
          html += '<div style="font-size:0.78rem; color:var(--muted); line-height:1.7; margin-bottom:12px;">';
          html += '<div><b style="color:var(--ink);">ID:</b> #'+c.id+'</div>';
          if(c.phone) html += '<div><b style="color:var(--ink);">Teléfono:</b> '+c.phone+'</div>';
          if(c.email) html += '<div><b style="color:var(--ink);">Email:</b> '+c.email+'</div>';
          if(c.birthday) html += '<div><b style="color:var(--ink);">Cumpleaños:</b> '+fmtBirthday(c.birthday)+(isBirthdayToday(c) ? ' 🎂 ¡Hoy!' : '')+'</div>';
          if(c.companyStatus === 'approved'){
            const co = state.allCompanies.find(x => x.id === c.companyCode);
            html += '<div><b style="color:var(--ink);">Empresa:</b> '+(co ? co.name+' — '+co.discount+(co.active?'':' (empresa inactiva)') : c.companyCode)+(c.companyEnabled===false?' (deshabilitado para este cliente)':'')+'</div>';
          } else if(c.companyStatus === 'pending'){
            html += '<div><b style="color:var(--ink);">Empresa:</b> solicitud pendiente ('+c.companyCode+')</div>';
          }
          html += '<div><b style="color:var(--ink);">Café(s) gratis canjeados:</b> '+(c.redeemed||0)+'</div>';
          const allTastes = topTastes(c, 6);
          if(allTastes.length) html += '<div><b style="color:var(--ink);">Le gusta:</b> '+allTastes.join(', ')+'</div>';
          if(c.internalNote) html += '<div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--line);"><b style="color:var(--ink);">Nota interna:</b> '+c.internalNote+'</div>';
          html += '</div>';

          if(!c.disabled && c.stamps >= STAMPS_GOAL){
            html += '<div class="free-banner" style="margin:0 0 12px; background:rgba(231,185,78,0.18); border-color:rgba(231,185,78,0.5); color:var(--mustard-deep);">🎉 ¡Felicitaciones! <b>'+c.name+'</b> completó sus '+STAMPS_GOAL+' sellos y tiene un café gratis esperando.</div>';
            if(state.isAdmin){
              html += '<div class="action-row"><button class="btn" onclick="redeemFree(\''+c.id+'\')">Activar café gratis</button></div>';
            } else {
              html += '<p class="note" style="margin-top:0;">Solo un administrador puede activar el café gratis y reiniciar sus sellos. Pedile a un administrador que entre con su PIN.</p>';
            }
          } else if(c.disabled){
            html += '<p class="note" style="margin-top:0;">Este cliente está deshabilitado — no se le pueden sumar sellos hasta que un administrador lo habilite.</p>';
          } else {
            const co = state.allCompanies.find(x => x.id === c.companyCode);
            const activeCompanyBenefit = c.companyStatus === 'approved' && !!co && co.active !== false && c.companyEnabled !== false;

            html += '<div class="field" style="margin-bottom:8px;"><label>N° de boleta</label>'
              + '<input id="receipt-input" placeholder="Ej: 004582" value="'+(state.receiptValue||'').replace(/"/g,'&quot;')+'" oninput="state.receiptValue=this.value; state.receiptWarning=\'\';"></div>';
            html += '<p class="note" style="margin-top:0; margin-bottom:10px;">Al sumar, la app le pregunta a Toteat qué café(s) compró, el monto y valida que esa boleta esté pagada y sin nota de crédito — no hace falta tipear productos ni monto a mano.</p>';
            if(activeCompanyBenefit){
              html += '<div style="background:rgba(231,185,78,0.22); border:1.5px solid var(--mustard); border-radius:14px; padding:14px 16px; margin-bottom:14px;">'
                + '<div style="font-weight:700; font-size:0.9rem; color:var(--mustard-deep); margin-bottom:4px;">🏢 Esta boleta tiene descuento de empresa</div>'
                + '<div style="font-size:0.82rem; color:var(--ink); line-height:1.5;">'+c.name+' tiene activo el descuento de <b>'+co.name+'</b> ('+co.discount+'). Esta compra <b>no suma sello</b> — los descuentos de empresa no se combinan con otras promociones. Para volver a sumar sellos, desactivá su beneficio desde "Empresas con descuento".</div>'
                + '</div>';
            }
            if(state.receiptWarning){
              html += '<div class="warn-text">'+state.receiptWarning+'</div>';
            }
            html += '<div class="action-row"><button class="btn" onclick="submitReceipt(\''+c.id+'\')">'+(state.lookingUpReceipt ? 'Buscando en Toteat...' : 'Buscar boleta y sumar sello')+'</button></div>';
            html += '<div class="action-row"><button class="btn" style="background:transparent; border:1.5px dashed var(--muted); color:var(--muted);" onclick="forceStamp(\''+c.id+'\')">⚠️ Forzar sello (prueba, sin Toteat)</button></div>';
          }

          const hist = c.history || [];
          html += '<div class="history-list"><div class="section-label" style="margin:14px 0 6px;">Actividad reciente</div>';
          if(hist.length === 0){
            html += '<div class="history-empty">Todavía no hay actividad registrada para este cliente.</div>';
          } else {
            hist.slice(0,5).forEach(h=>{
              const d = new Date(h.ts);
              const when = d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
              if(h.redemption){
                html += '<div class="history-item"><span>'+when+'</span><b style="color:var(--mustard-deep);">🎉 Canje gratis</b></div>';
              } else {
                html += '<div class="history-item"><span>'+when+(h.products && h.products.length ? ' · '+h.products.join(', ') : '')+(h.amount != null ? ' · $'+h.amount : '')+(h.companyDiscount ? ' · 🏢 con descuento (no sumó sello)' : '')+'</span><b>N° '+h.receipt+'</b></div>';
                if(h.productDetails && h.productDetails.length){
                  html += '<div style="padding:2px 0 8px 8px; font-size:0.7rem; color:var(--muted);">';
                  h.productDetails.forEach(p=>{
                    html += '<div>'+p.name+(p.quantity>1?' x'+p.quantity:'')+' — $'+p.amount+(h.mainCoffee && h.mainCoffee.name===p.name ? ' ☕' : '')+'</div>';
                  });
                  html += '</div>';
                }
              }
            });
          }
          html += '</div>';
          html += '<div class="action-row">'
            + '<button class="btn secondary" onclick="clearCustomerHistory(\''+c.id+'\', \''+c.name.replace(/'/g,"\\'")+'\')">🗑️ Borrar historial (reiniciar a 0)</button>'
            + '</div>';
          if(c.historyBackup){
            html += '<div class="action-row"><button class="btn" style="background:transparent; border:1.5px dashed var(--mustard); color:var(--mustard-deep);" onclick="restoreCustomerHistory(\''+c.id+'\', \''+c.name.replace(/'/g,"\\'")+'\')">↩️ Restaurar historial anterior</button></div>';
          }
          html += '</div>'; // end customer-expand
        }

        html += '</div>'; // end customer-block
      });
      html += '</div>';
    }

    if(state.isAdmin){
      html += '<button class="btn secondary" style="margin-top:20px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;" onclick="state.showCompaniesPanel = !state.showCompaniesPanel; render();">'
        + '<span>🏢 Empresas con descuento'+(state.allCompanies.length ? ' ('+state.allCompanies.length+')' : '')+'</span>'
        + '<span>'+(state.showCompaniesPanel ? '▲' : '▼')+'</span>'
        + '</button>';
    }
    if(state.isAdmin && state.showCompaniesPanel){
      html += '<button class="btn secondary" style="margin-bottom:14px;" onclick="state.showCreateCompanyForm = !state.showCreateCompanyForm; render();">'+(state.showCreateCompanyForm ? '✕ Cancelar' : '+ Crear nueva empresa')+'</button>';
      if(state.showCreateCompanyForm){
        html += '<div class="receipt-box" style="margin-bottom:14px;">';
        html += '<div class="field" style="margin-bottom:8px;"><label>Nombre de la empresa</label>'
          + '<input id="new-company-name" value="'+(state.newCompanyName||'').replace(/"/g,'&quot;')+'" oninput="state.newCompanyName=this.value;"></div>';
        html += '<div class="field" style="margin-bottom:8px;"><label>Código (para compartir con sus empleados)</label>'
          + '<input id="new-company-code" placeholder="Ej: ACME2026" value="'+(state.newCompanyCode||'').replace(/"/g,'&quot;')+'" oninput="state.newCompanyCode=this.value;"></div>';
        html += '<div class="field" style="margin-bottom:8px;"><label>Descuento</label>'
          + '<input id="new-company-discount" placeholder="Ej: 15% en toda compra" value="'+(state.newCompanyDiscount||'').replace(/"/g,'&quot;')+'" oninput="state.newCompanyDiscount=this.value;"></div>';
        html += '<button class="btn secondary" onclick="createCompany()">Crear empresa</button>';
        html += '<p class="note" style="margin-top:10px; margin-bottom:0;">Los descuentos de empresa no se combinan con otras promociones: una boleta marcada "con descuento de empresa" no suma sello para el café gratis.</p>';
        html += '</div>';
      }

      if(state.allCompanies.length === 0){
        html += '<div class="empty-state" style="padding:14px 10px;">Todavía no creaste ninguna empresa.</div>';
      } else {
        html += '<div class="staff-list" style="margin-bottom:14px;">';
        state.allCompanies.forEach(co=>{
          const expanded = state.expandedCompanyId === co.id;
          const editingCompany = state.editingCompanyId === co.id;
          const companyClients = state.allCustomers.filter(c => c.companyCode === co.id && (c.companyStatus === 'approved' || c.companyStatus === 'pending'));
          const approvedCount = companyClients.filter(c => c.companyStatus === 'approved').length;

          html += '<div class="customer-block">';
          html += '<div class="cust-row '+(expanded?'selected':'')+'">'
            + '<div style="flex:1; min-width:0;" onclick="toggleCompanyExpand(\''+co.id+'\')">'
              + '<div class="cname">'+co.name+'<span class="cid">#'+co.id+'</span>'+(co.active ? '' : ' <span style="color:var(--danger); font-size:0.6rem; text-transform:uppercase;">· Inactiva</span>')+'</div>'
              + '<div class="cmeta">'+co.discount+' · '+approvedCount+' cliente(s)</div>'
              + '</div>'
            + '<div class="mini-actions">'
              + '<button class="mini-btn" onclick="event.stopPropagation(); toggleCompanyEditForm(\''+co.id+'\')">Modificar</button>'
              + '<button class="mini-btn '+(co.active?'danger':'')+'" onclick="event.stopPropagation(); toggleCompanyActive(\''+co.id+'\')">'+(co.active?'Desactivar':'Activar')+'</button>'
              + '<button class="mini-btn danger" onclick="event.stopPropagation(); deleteCompany(\''+co.id+'\', \''+co.name.replace(/'/g,"\\'")+'\')">Eliminar</button>'
              + '</div>'
            + '</div>';

          if(editingCompany){
            html += '<div class="customer-expand">';
            html += '<div class="field" style="margin-bottom:8px;"><label>Nombre de la empresa</label>'
              + '<input id="edit-company-name" value="'+(state.editCompanyName||'').replace(/"/g,'&quot;')+'" oninput="state.editCompanyName=this.value;"></div>';
            html += '<div class="field" style="margin-bottom:8px;"><label>Descuento</label>'
              + '<input id="edit-company-discount" value="'+(state.editCompanyDiscount||'').replace(/"/g,'&quot;')+'" oninput="state.editCompanyDiscount=this.value;"></div>';
            html += '<p class="note" style="margin-top:0;">El código (#'+co.id+') no se puede modificar, ya lo tienen sus empleados. Los cambios de nombre y descuento se reflejan al instante para todos los clientes vinculados.</p>';
            html += '<div class="action-row">'
              + '<button class="btn secondary" onclick="toggleCompanyEditForm(null)">Cancelar</button>'
              + '<button class="btn" onclick="saveCompanyEdit(\''+co.id+'\')">Guardar</button>'
              + '</div>';
            html += '</div>';
          }

          if(expanded){
            html += '<div class="customer-expand">';

            if(companyClients.length === 0){
              html += '<div class="history-empty">Todavía no hay clientes vinculados a esta empresa.</div>';
            } else {
              companyClients.forEach(c=>{
                const pending = c.companyStatus === 'pending';
                const clientDisabled = c.companyEnabled === false;
                const clientExpanded = state.expandedCompanyClientId === c.id;
                html += '<div class="history-item" style="align-items:center; cursor:pointer;" onclick="toggleCompanyClientExpand(\''+c.id+'\')">'
                  + '<span>'+c.name+(pending ? ' · pendiente' : clientDisabled ? ' · deshabilitado' : '')+'</span>'
                  + '<span style="display:flex; gap:6px;" onclick="event.stopPropagation();">'
                  + (pending
                      ? '<button class="mini-btn" onclick="approveCompany(\''+c.id+'\')">Aprobar</button><button class="mini-btn danger" onclick="rejectCompany(\''+c.id+'\')">Rechazar</button>'
                      : '<button class="mini-btn" onclick="setClientCompanyEnabled(\''+c.id+'\', '+(clientDisabled?'true':'false')+')">'+(clientDisabled?'Habilitar':'Deshabilitar')+'</button><button class="mini-btn danger" onclick="removeClientCompany(\''+c.id+'\')">Quitar</button>'
                    )
                  + '</span></div>';

                if(clientExpanded){
                  html += '<div style="padding:6px 4px 16px; font-size:0.78rem; color:var(--muted); line-height:1.7;">';
                  html += '<div><b style="color:var(--ink);">ID:</b> #'+c.id+'</div>';
                  if(c.phone) html += '<div><b style="color:var(--ink);">Teléfono:</b> '+c.phone+'</div>';
                  if(c.email) html += '<div><b style="color:var(--ink);">Email:</b> '+c.email+'</div>';
                  html += '<div><b style="color:var(--ink);">RUT:</b> '+(c.rut ? formatRut(c.rut) : 'no ingresado')+'</div>';
                  html += '<div class="field" style="margin-top:8px; margin-bottom:6px;"><label>RUT (verificación de empresa)</label>'
                    + '<input id="edit-client-rut" placeholder="Ej: 12.345.678-9" value="'+(state.editClientRut||'').replace(/"/g,'&quot;')+'" oninput="state.editClientRut=this.value;"></div>';
                  html += '<button class="btn secondary" onclick="saveClientRut(\''+c.id+'\')">Guardar RUT</button>';
                  html += '</div>';
                }
              });
            }

            html += '<div class="field" style="margin-top:12px; margin-bottom:8px;"><label>Agregar cliente a esta empresa</label>'
              + '<input id="add-company-client-search" placeholder="Buscar por nombre, teléfono, email o ID..." value="'+(state.addCompanyClientSearch||'').replace(/"/g,'&quot;')+'" oninput="state.addCompanyClientSearch=this.value; render();"></div>';

            const q = (state.addCompanyClientSearch||'').trim();
            if(q){
              const candidates = state.allCustomers.filter(c => matchesSearch(c, q) && !(c.companyCode === co.id && (c.companyStatus === 'approved' || c.companyStatus === 'pending')));
              if(candidates.length === 0){
                html += '<div class="history-empty">Sin coincidencias.</div>';
              } else {
                candidates.slice(0,5).forEach(c=>{
                  html += '<div class="history-item"><span>'+c.name+' <span style="color:var(--muted);">#'+c.id+'</span></span>'
                    + '<button class="mini-btn" onclick="addClientToCompany(\''+co.id+'\', \''+c.id+'\')">Vincular</button></div>';
                });
              }
            }

            html += '</div>'; // customer-expand
          }
          html += '</div>'; // customer-block
        });
        html += '</div>';
      }

      if(state.deletedCompanies.length > 0){
        html += '<div class="section-label">Empresas eliminadas recientemente</div>';
        html += '<div class="staff-list" style="margin-bottom:14px;">';
        state.deletedCompanies.slice(0,5).forEach(co=>{
          html += '<div class="cust-row">'
            + '<div><div class="cname">'+co.name+'<span class="cid">#'+co.id+'</span></div><div class="cmeta">'+co.discount+'</div></div>'
            + '<button class="mini-btn" onclick="restoreDeletedCompany(\''+co.id+'\', \''+co.name.replace(/'/g,"\\'")+'\')">↩️ Restaurar</button>'
            + '</div>';
        });
        html += '</div>';
      }

      const orphanPending = state.allCustomers.filter(c => c.companyStatus === 'pending' && !state.allCompanies.some(co => co.id === c.companyCode));
      if(orphanPending.length > 0){
        html += '<div class="section-label">Solicitudes con código no reconocido ('+orphanPending.length+')</div>';
        html += '<div class="staff-list" style="margin-bottom:20px;">';
        orphanPending.forEach(c=>{
          html += '<div class="cust-row">'
            + '<div><div class="cname">'+c.name+'</div><div class="cmeta">Código: '+c.companyCode+' · no coincide con ninguna empresa creada</div></div>'
            + '<button class="mini-btn danger" onclick="rejectCompany(\''+c.id+'\')">Rechazar</button>'
            + '</div>';
        });
        html += '</div>';
      }
    }

    if(state.isAdmin){
      html += '<button class="btn secondary" style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;" onclick="state.showPromoPanel = !state.showPromoPanel; render();">'
        + '<span>📣 Enviar promoción</span>'
        + '<span>'+(state.showPromoPanel ? '▲' : '▼')+'</span>'
        + '</button>';
    }

    if(state.isAdmin && state.showPromoPanel){
    html += '<div class="section-label">Enviar promoción</div>';
    if(state.allCustomers.length === 0){
      html += '<div class="empty-state">Necesitás al menos un cliente registrado para enviar promociones.</div>';
    } else {
      html += '<div class="field" style="margin-bottom:10px;"><label>Buscar por gusto</label>'
        + '<input id="taste-filter" placeholder="Ej: matcha, croissant" value="'+(state.tasteFilter||'').replace(/"/g,'&quot;')+'" oninput="state.tasteFilter=this.value;"></div>';
      html += '<button class="btn secondary" style="margin-bottom:14px;" onclick="selectByTaste()">Seleccionar coincidencias</button>';
      state.allCustomers.forEach(c=>{
        const checked = state.promoSelected.has(c.id);
        const tastes = topTastes(c, 3);
        html += '<div class="checkbox-row" style="margin-bottom:8px; align-items:flex-start;">'
          + '<input type="checkbox" style="margin-top:2px;" '+(checked?'checked':'')+' onchange="togglePromo(\''+c.id+'\')">'
          + '<span>'+c.name+(tastes.length ? ' <span style="color:var(--muted-on-dark); font-size:0.78rem;">('+tastes.join(', ')+')</span>' : '')+'</span></div>';
      });
      html += '<div class="field" style="margin-top:10px;"><label>Mensaje</label><textarea id="promo-text" placeholder="Ej: Este finde, 2x1 en café con nuestra tarjeta de fidelización">'+state.promoText+'</textarea></div>';
      html += '<button class="btn secondary" onclick="sendPromo()">Enviar a seleccionados</button>';
      html += '<p class="note">Esta demo simula el envío. Para mandar SMS/email reales hace falta conectar un proveedor como Twilio o un servicio de email marketing desde un backend.</p>';
    }

    if(state.allCustomers.length > 0){
      html += '<p class="note">El N° de boleta y los productos quedan guardados por cliente para cruzarlos contra Toteat y armar su perfil de gustos con el tiempo. Acá se cargan a mano; en producción, al confirmar la boleta, tu backend le pediría a la API de Toteat el detalle de esa orden (los productos vendidos) y completaría este perfil automáticamente, sin que el staff tenga que tipearlo.</p>';
    }
    }

    } // fin del bloque protegido por login de administrador
  }

  html += '</main>';
  if(state.toast) html += '<div class="toast">'+state.toast+'</div>';

  if(state.showReportModal){
    const { start, end } = getReportDateRange();
    const summary = reportSummary();
    html += '<div class="report-backdrop" onclick="if(event.target===event.currentTarget){ closeReportModal(); }">';
    html += '<div class="report-panel">';
    html += '<div class="report-header"><h2>Informe de actividad</h2><button class="report-close" onclick="closeReportModal()">✕</button></div>';

    html += '<div class="mode-toggle" style="margin-bottom:16px; width:100%;">'
      + '<button style="flex:1;" class="'+(state.reportFilterMode==='month'?'active':'')+'" onclick="state.reportFilterMode=\'month\'; render();">Por mes</button>'
      + '<button style="flex:1;" class="'+(state.reportFilterMode==='range'?'active':'')+'" onclick="state.reportFilterMode=\'range\'; render();">Línea de tiempo</button>'
      + '</div>';

    if(state.reportFilterMode === 'month'){
      html += '<div class="bday-row" style="margin-bottom:14px;">'
        + '<select id="report-month" style="flex:1.5;" onchange="state.reportMonth=this.value; render();">'+monthSelectOptions(state.reportMonth)+'</select>'
        + '<select id="report-year" style="flex:1.2;" onchange="state.reportYear=this.value; render();">'+yearSelectOptions(state.reportYear)+'</select>'
        + '</div>';
    } else {
      html += '<div style="margin-bottom:16px;">'
        + '<input type="range" id="report-range-slider" min="1" max="365" value="'+state.reportDaysBack+'" style="width:100%;" '
          + 'oninput="document.getElementById(\'report-range-label\').textContent=\'Últimos \'+this.value+\' días\';" '
          + 'onchange="state.reportDaysBack=this.value; render();">'
        + '<div id="report-range-label" style="text-align:center; font-size:0.8rem; color:var(--muted); margin-top:6px;">Últimos '+state.reportDaysBack+' días</div>'
        + '</div>';
    }

    html += '<div style="font-size:0.78rem; color:var(--muted); margin-bottom:4px;">Período: '+start.toLocaleDateString()+' al '+end.toLocaleDateString()+'</div>';
    html += '<div style="font-family:\'JetBrains Mono\'; font-size:1.05rem; color:var(--ink); margin-bottom:18px;">'+summary.count+' registro'+(summary.count===1?'':'s')+' · $'+summary.total.toLocaleString('es-CL')+' en total</div>';

    html += '<button class="btn" onclick="downloadReport()">⬇ Descargar Excel (.xlsx)</button>';
    html += '<p class="note" style="margin-top:12px;">Incluye sellos, canjes de café gratis y compras con descuento de empresa, con cliente, boleta, productos, monto y empresa asociada.</p>';

    html += '</div>'; // report-panel
    html += '</div>'; // report-backdrop
  }

  app.innerHTML = html;
  restoreFocus(focusInfo);
}

function switchMode(m){
  state.mode = m;
  state.selectedCustomerId = null;
  if(m === 'staff' || m === 'preview'){
    Promise.all([loadAllCustomers(), loadCompanies()]).then(render);
  } else {
    render();
  }
}

async function refreshPreview(){
  await Promise.all([loadAllCustomers(), loadCompanies()]);
  showToast('Datos actualizados');
  render();
}

function selectPreview(id){
  state.previewCustomerId = state.previewCustomerId === id ? null : id;
  render();
}

async function adminSignInEmail(){
  const email = (state.adminEmailInput||'').trim();
  const password = state.adminPasswordInput||'';
  if(!email || !password){ showToast('Completá email y contraseña'); return; }

function getReportDateRange(){
  if(state.reportFilterMode === 'month'){
    const y = parseInt(state.reportYear, 10);
    const m = parseInt(state.reportMonth, 10);
    const start = new Date(y, m-1, 1, 0, 0, 0);
    const end = new Date(y, m, 0, 23, 59, 59);
    return { start, end };
  } else {
    const days = parseInt(state.reportDaysBack, 10) || 30;
    const end = new Date();
    const start = new Date();
    start.setDate(start.getDate() - days);
    start.setHours(0,0,0,0);
    return { start, end };
  }
}

function generateReportRows(){
  const { start, end } = getReportDateRange();
  const rows = [];
  state.allCustomers.forEach(c=>{
    (c.history || []).forEach(h=>{
      const d = new Date(h.ts);
      if(d < start || d > end) return;
      let tipo = 'Sello';
      if(h.redemption) tipo = 'Canje café gratis';
      else if(h.companyDiscount) tipo = 'Con descuento de empresa';
      rows.push({
        'Cliente': c.name,
        'ID Cliente': c.id,
        'Teléfono': c.phone || '',
        'Email': c.email || '',
        'Fecha': d.toLocaleDateString(),
        'Hora': d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),
        'Tipo': tipo,
        'N° Boleta': h.receipt || '',
        'Productos': (h.products || []).join(', '),
        'Monto': h.amount != null ? h.amount : '',
        'Empresa': h.companyName || '',
        'Descuento aplicado': h.companyDiscountLabel || ''
      });
    });
  });
  rows.sort((a,b) => (a['Fecha']+a['Hora']).localeCompare(b['Fecha']+b['Hora']));
  return rows;
}

function reportSummary(){
  const rows = generateReportRows();
  const total = rows.reduce((sum, r) => sum + (typeof r['Monto'] === 'number' ? r['Monto'] : 0), 0);
  return { count: rows.length, total };
}

  if(!state.isAdmin){ showToast('Solo un administrador puede descargar informes.'); return; }

function formatRut(raw){
  if(!raw) return '';
  const clean = raw.toString().toUpperCase().replace(/[^0-9K]/g, '');
  if(clean.length < 2) return clean;
  const verifier = clean.slice(-1);
  const body = clean.slice(0, -1);
  let withDots = '';
  let count = 0;
  for(let i = body.length - 1; i >= 0; i--){
    withDots = body[i] + withDots;
    count++;
    if(count % 3 === 0 && i !== 0){
      withDots = '.' + withDots;
    }
  }
  return withDots + '-' + verifier;
}

    showToast('No se pudo validar los datos, probá de nuevo.');

  const snap = await fsGetDoc(fsDoc(db, 'customers', id));

  const oldEmail = cust.email;

    }
    if(oldEmail !== email){

      if(email) await fsSetDoc(fsDoc(db, 'emailIndex', email), { customerId: id });
    }
  }catch(e){ console.error(e); }

}

// directo en modo Personal, lo dejamos listo antes del primer render.
try{
  if(isStaffDevice() && localStorage.getItem('norai-default-mode') === 'staff'){
    state.mode = 'staff';
  }
}catch(e){}

(async function start(){
  const ok = await initFirebase();
  if(ok) loadMe();
})();
</script>
</body>
</html>
